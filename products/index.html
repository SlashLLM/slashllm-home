                            {['#ff5f56', '#ffbd2e', '#27c93f'].map((c, i) => <div key={i} style={{ width: 9, height: 9, borderRadius: '50%', background: c }} />)}
                          </div>
                          <span style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11, color: 'rgba(255,255,255,0.4)' }}>{prod.name.toLowerCase().replace(/\s+/g, '_')}.ts</span>
                        </div>
                        <pre style={{ padding: '20px 22px', fontFamily: '"JetBrains Mono",monospace', fontSize: 11.5, color: '#c4b5fd', lineHeight: 1.6, overflowX: 'auto' }}>
                          <code>{prod.code}</code>
                        </pre>
                      </div>

                    </div>
                  </div>
                ))}
              </div>
            </section>
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ProductsPage />);
  </script>
</body>
</html>
