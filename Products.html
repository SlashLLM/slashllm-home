    :root {
      --color-canvas: #ffffff;
      --color-obsidian-ink: #010110;
      --color-carbon: #111117;
      --color-graphite: #22222a;
      --color-fog: #73737c;
      --color-ash: #d9d9d9;
      --color-iris-pulse: #635bff;
      --border-hairline: rgba(1, 1, 16, 0.1);
      --border-dark-hairline: rgba(255, 255, 255, 0.08);

      --font-display: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-sans: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      --page-max-width: 1200px;
      --radius-cards: 8px;
      --radius-buttons: 100px;
      --radius-tags: 9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-canvas);
      color: var(--color-obsidian-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }

    .font-display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; }
    .font-sans { font-family: var(--font-sans); letter-spacing: -0.015em; }
    .font-mono { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }

      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline;
    }
    .nav-link-active {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      font-weight: 700 !important;
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .nav-link-active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 8px;
      right: 8px;
      height: 2.5px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      color: #ffffff !important;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      padding: 12px 24px;
      border-radius: var(--radius-buttons);
      border: 1px solid transparent;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-obsidian-ink) !important;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      padding: 12px 24px;

      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;

      background: #f5f3ff;
      border-color: var(--color-iris-pulse);

      font-weight: 500;

    }

      background: #ffffff;
      color: var(--color-iris-pulse) !important;
    }

    .card-editorial {
      background: var(--color-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-cards);
      padding: 40px;
      position: relative;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .card-editorial::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-editorial:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 91, 255, 0.4);
      box-shadow: 0 20px 40px -12px rgba(99, 91, 255, 0.18), 0 0 24px -4px rgba(168, 85, 247, 0.12);
    }
    .card-editorial:hover::before {
      opacity: 1;
      transform: scaleX(1);
    }
    .card-editorial .card-icon-wrap {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }
    .card-editorial:hover .card-icon-wrap {
      transform: scale(1.08);
      background: linear-gradient(135deg, rgba(0, 192, 248, 0.15), rgba(99, 102, 241, 0.15), rgba(251, 104, 195, 0.15)) !important;
      color: var(--color-iris-pulse) !important;
      box-shadow: 0 4px 14px rgba(99, 91, 255, 0.15);
    }
    .card-editorial .link-editorial svg,
    .card-editorial a svg {
      transition: transform 0.25s ease;
    }
    .card-editorial:hover .link-editorial svg,
    .card-editorial:hover a svg {
      transform: translateX(4px);
    }

    .link-editorial {
      color: var(--color-obsidian-ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .link-editorial:hover {
      color: var(--color-iris-pulse);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-muted { color: var(--color-fog); text-decoration: none; transition: color 0.15s ease; }
    .link-muted:hover { color: var(--color-obsidian-ink); }

    /* Dropdown Menu */
    .nav-item-wrap {
      position: relative;
    }
    .nav-dropdown {
      position: absolute;
      top: 100%;
      margin-top: 6px;
      background: #ffffff;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-cards);
      box-shadow: 0 16px 36px rgba(1, 1, 16, 0.08);
      padding: 12px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    /* Invisible hover bridge spanning between nav item and dropdown */
    .nav-dropdown::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 20px;
      display: block;
    }
    .nav-item-wrap:hover .nav-dropdown,
    .nav-item-wrap:focus-within .nav-dropdown,
    .nav-dropdown:hover,
    .nav-dropdown.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .halftone-pattern {
      background-image: radial-gradient(var(--color-ash) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    @media (max-width: 1024px) {
      .grid-2col { grid-template-columns: 1fr !important; gap: 32px !important; }
      .hide-mobile { display: none !important; }
      .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 36px !important; }
    }
    @media (max-width: 640px) {
      .footer-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>

                        <h2 className="font-display" style={{ fontSize: 28, fontWeight: 600, color: 'var(--color-obsidian-ink)', marginBottom: 12, lineHeight: 1.15 }}>
                          {prod.name}
                        </h2>
                        <p style={{ fontSize: 16, fontWeight: 600, color: 'var(--color-obsidian-ink)', marginBottom: 14 }}>
                          {prod.headline}
                        </p>
                        <p style={{ fontSize: 15.5, color: 'var(--color-fog)', lineHeight: 1.65, marginBottom: 24 }}>
                          {prod.desc}
                        </p>
                        
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 11, marginBottom: 28 }}>
                          {prod.features.map((feat, fIdx) => (
                            <div key={fIdx} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 14.5, color: 'var(--color-obsidian-ink)', lineHeight: 1.45, fontWeight: 450 }}>
                              <span style={{ color: 'var(--color-obsidian-ink)', flexShrink: 0, marginTop: 2 }}><Icon name="check" size={14} /></span>
                              <span>{feat}</span>
                            </div>
                          ))}
                        </div>

                        <div>
                          <a href="https://cal.com/mridhul-pax-jjhwct/30min" target="_blank" rel="noopener noreferrer" className="btn-primary">
                            Request Platform Demo <Icon name="arrowRight" size={14} />
                          </a>
                        </div>
                      </div>

                      {/* Code Window in Purple Gradient */}
                      <div style={{ background: 'linear-gradient(135deg, #0c0a21 0%, #1e134b 55%, #351c75 100%)', border: '1px solid rgba(99, 91, 255, 0.3)', borderRadius: 'var(--radius-cards)', overflow: 'hidden', boxShadow: '0 12px 36px rgba(30, 19, 75, 0.2)' }}>
                        <div style={{ background: 'rgba(255, 255, 255, 0.06)', padding: '12px 18px', display: 'flex', alignItems: 'center', gap: 8, borderBottom: '1px solid rgba(255, 255, 255, 0.1)' }}>
                          <div style={{ display: 'flex', gap: 6 }}>
                            {['rgba(255,255,255,0.2)', 'rgba(255,255,255,0.3)', 'rgba(255,255,255,0.4)'].map((c, i) => <div key={i} style={{ width: 9, height: 9, borderRadius: '50%', background: c }} />)}
                          </div>
                          <span className="font-mono" style={{ fontSize: 11, color: 'rgba(255, 255, 255, 0.7)', fontWeight: 600 }}>{prod.name.toLowerCase().replace(/\s+/g, '_')}.ts</span>
                        </div>
                        <pre style={{ padding: '22px 24px', fontFamily: 'var(--font-mono)', fontSize: 13, color: '#f3f0ff', lineHeight: 1.6, overflowX: 'auto' }}>
                          <code>{prod.code}</code>
                        </pre>
                      </div>

                    </div>
                  </div>
                ))}
              </div>
            </section>
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ProductsPage />);
  </script>
</body>
