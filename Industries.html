<!-- ═══ SCRIPT 3 · App Mount ═══ -->
<script type="text/babel">
  function App() {
    const [activeId, setActiveId] = React.useState('hr');

    React.useEffect(() => {
      const sections = document.querySelectorAll('[data-ind-id]');
      const spyObs = new IntersectionObserver(
        entries => entries.forEach(e => { if (e.isIntersecting) setActiveId(e.target.getAttribute('data-ind-id')); }),
        { rootMargin:'-22% 0px -68% 0px', threshold:0 }
      );
      sections.forEach(s => spyObs.observe(s));

      const revEls = document.querySelectorAll('.reveal');
      const revObs = new IntersectionObserver(
        entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revObs.unobserve(e.target); } }),
        { threshold:0.04 }
      );
      revEls.forEach(el => revObs.observe(el));

      return () => { spyObs.disconnect(); revObs.disconnect(); };
    }, []);

    return (
      <React.Fragment>
        <Nav />
        <main>
          <IndustriesHero />
          <StickyIndustryNav activeId={activeId} />
          {INDUSTRIES.map(ind => (
            <React.Fragment key={ind.id}>
              <ChapterLine num={ind.num} bg={ind.bg} />
              <IndustrySection ind={ind} />
            </React.Fragment>
          ))}
          <IndustriesCTA />
        </main>
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
