              <div style={{ display: 'flex', flexDirection: 'column', gap: 40 }}>
                {INDUSTRIES.map((ind, idx) => (
                  <div key={ind.id} id={ind.id} className="card-editorial">
                    <div style={{ display: 'grid', gridTemplateColumns: '52% 48%', gap: 48, alignItems: 'center' }} className="ind-grid">
                      <div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
                          <div style={{ width: 38, height: 38, borderRadius: 6, background: '#f0f0f2', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--color-obsidian-ink)' }}>
                            <Icon name={ind.icon} size={19} />
                          </div>
                          <span className="font-mono" style={{ fontSize: 11.5, color: 'var(--color-fog)', fontWeight: 600 }}>Sector 0{idx+1}</span>
                        </div>

                        <h2 className="font-display" style={{ fontSize: 28, fontWeight: 600, color: 'var(--color-obsidian-ink)', lineHeight: 1.15, marginBottom: 16 }}>
                          {ind.headline[0]} {ind.headline[1]}
                        </h2>

                        <p style={{ fontSize: 15.5, color: 'var(--color-fog)', lineHeight: 1.65, marginBottom: 26 }}>
                          {ind.desc}
                        </p>

                        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
                          <a href="https://cal.com/mridhul-pax-jjhwct/30min" target="_blank" rel="noopener noreferrer" className="btn-primary">
                            Discuss {ind.short} AI <Icon name="arrowRight" size={14} />
                          </a>
                        </div>
                      </div>

                      {/* Right Panel: Metric Callout & Use Cases */}
                      <div style={{ background: '#fafafa', border: '1px solid var(--border-hairline)', borderRadius: 'var(--radius-cards)', padding: '30px 28px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderBottom: '1px solid var(--border-hairline)', paddingBottom: 16, marginBottom: 20 }}>
                          <div>
                            <span className="font-display" style={{ fontSize: 38, fontWeight: 700, color: 'var(--color-obsidian-ink)' }}>{ind.metric}</span>
                            <p className="font-mono" style={{ fontSize: 11, color: 'var(--color-fog)', fontWeight: 600, marginTop: 4 }}>{ind.metricDesc}</p>
                          </div>
                          <span className="font-mono" style={{ fontSize: 11, color: 'var(--color-iris-pulse)', fontWeight: 600 }}>Production Proven</span>
                        </div>

                        <p className="font-mono" style={{ fontSize: 11, color: 'var(--color-obsidian-ink)', fontWeight: 600, marginBottom: 16 }}>
                          Core Industry Architectures
                        </p>
                        <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 11 }}>
                          {ind.useCases.map((uc, uIdx) => (
                            <li key={uIdx} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 14.5, color: 'var(--color-obsidian-ink)', lineHeight: 1.45, fontWeight: 450 }}>
                              <span style={{ color: 'var(--color-obsidian-ink)', flexShrink: 0, marginTop: 2 }}><Icon name="check" size={14} /></span>
                              <span>{uc}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                    </div>
                  </div>
                ))}
              </div>
            </section>
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IndustriesPage />);
  </script>
</body>
</html>
