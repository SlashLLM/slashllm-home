<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Verticals — SlashLLM</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/uploads/favicon-32.png?v=2" sizes="32x32">
  <link rel="icon" type="image/png" href="/uploads/favicon-16.png?v=2" sizes="16x16">
  <link rel="apple-touch-icon" href="/uploads/favicon-180.png?v=2">
  <meta name="description" content="Discover how SlashLLM delivers enterprise AI engineering across 6 key industry verticals: Financial Services, Healthcare, SaaS, Retail, Manufacturing, and Professional Services.">
  <link rel="canonical" href="https://slashllm.com/Industries.html">
  <meta property="og:title" content="Industry Verticals — SlashLLM">
  <meta property="og:description" content="Domain-specific enterprise AI systems engineered for regulatory compliance and measurable business outcomes.">
  <meta property="og:image" content="https://slashllm.com/uploads/LOGO%202.png">

  <!-- Single Unified Typography: Proxima Nova -->
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin="anonymous">
  <link href="https://fonts.cdnfonts.com/css/proxima-nova" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    :root {
      --color-canvas: #ffffff;
      --color-obsidian-ink: #010110;
      --color-carbon: #111117;
      --color-graphite: #22222a;
      --color-fog: #73737c;
      --color-ash: #d9d9d9;
      --color-iris-pulse: #635bff;
      --border-hairline: rgba(1, 1, 16, 0.1);
      --border-dark-hairline: rgba(255, 255, 255, 0.08);

      --font-display: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-sans: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      --page-max-width: 1200px;
      --radius-cards: 8px;
      --radius-buttons: 100px;
      --radius-tags: 9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-canvas);
      color: var(--color-obsidian-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }

    .font-display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; }
    .font-sans { font-family: var(--font-sans); letter-spacing: -0.015em; }
    .font-mono { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }

    .gradient-text-purple {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline;
    }
    .nav-link-active {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      font-weight: 700 !important;
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .nav-link-active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 8px;
      right: 8px;
      height: 2.5px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      color: #ffffff !important;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      padding: 12px 24px;
      border-radius: var(--radius-buttons);
      border: 1px solid transparent;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-obsidian-ink) !important;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      padding: 12px 24px;
      border-radius: var(--radius-buttons);
      border: 1px solid rgba(1, 1, 16, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-ghost:hover {
      background: #f5f3ff;
      border-color: var(--color-iris-pulse);
      color: var(--color-iris-pulse) !important;
    }

    .btn-pill-header {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff !important;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: var(--radius-buttons);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-pill-header:hover {
      background: #ffffff;
      color: var(--color-iris-pulse) !important;
    }

    .card-editorial {
      background: var(--color-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-cards);
      padding: 36px;
      position: relative;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .card-editorial::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-editorial:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 91, 255, 0.4);
      box-shadow: 0 20px 40px -12px rgba(99, 91, 255, 0.18), 0 0 24px -4px rgba(168, 85, 247, 0.12);
    }
    .card-editorial:hover::before {
      opacity: 1;
      transform: scaleX(1);
    }
    .card-editorial .card-icon-wrap {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }
    .card-editorial:hover .card-icon-wrap {
      transform: scale(1.08);
      background: linear-gradient(135deg, rgba(0, 192, 248, 0.15), rgba(99, 102, 241, 0.15), rgba(251, 104, 195, 0.15)) !important;
      color: var(--color-iris-pulse) !important;
      box-shadow: 0 4px 14px rgba(99, 91, 255, 0.15);
    }
    .card-editorial .link-editorial svg,
    .card-editorial a svg {
      transition: transform 0.25s ease;
    }
    .card-editorial:hover .link-editorial svg,
    .card-editorial:hover a svg {
      transform: translateX(4px);
    }

    .link-editorial {
      color: var(--color-obsidian-ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .link-editorial:hover {
      color: var(--color-iris-pulse);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-muted { color: var(--color-fog); text-decoration: none; transition: color 0.15s ease; }
    .link-muted:hover { color: var(--color-obsidian-ink); }

    /* Dropdown Menu */
    .nav-item-wrap {
      position: relative;
    }
    .nav-dropdown {
      position: absolute;
      top: 100%;
      margin-top: 6px;
      background: #ffffff;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-cards);
      box-shadow: 0 16px 36px rgba(1, 1, 16, 0.08);
      padding: 12px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    /* Invisible hover bridge spanning between nav item and dropdown */
    .nav-dropdown::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 20px;
      display: block;
    }
    .nav-item-wrap:hover .nav-dropdown,
    .nav-item-wrap:focus-within .nav-dropdown,
    .nav-dropdown:hover,
    .nav-dropdown.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .halftone-pattern {
      background-image: radial-gradient(var(--color-ash) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .ind-tab {
      background: #ffffff;
      border: 1px solid rgba(1, 1, 16, 0.16);
      color: #0c0a21;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      transition: all 0.18s ease;
    }
    .ind-tab .tab-num {
      color: #555566;
      font-weight: 700;
      transition: color 0.18s ease;
    }
    .ind-tab.is-active, .ind-tab:hover {
      background: linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .ind-tab.is-active .tab-num, .ind-tab:hover .tab-num {
      color: rgba(255, 255, 255, 0.85);
    }

    .subnav-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 91, 255, 0.3) transparent;
    }
    .subnav-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .subnav-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .subnav-scroll::-webkit-scrollbar-thumb {
      background: rgba(99, 91, 255, 0.25);
      border-radius: 9999px;
    }
    .subnav-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 91, 255, 0.5);
    }

    @media (max-width: 1024px) {
      .ind-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
      .hide-mobile { display: none !important; }
      .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 36px !important; }
    }
    @media (max-width: 640px) {
      .footer-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, size=18, color='currentColor', className='' }) => {
      const paths = {
        arrowRight: <path d="M5 12h14M12 5l7 7-7 7"/>,
        chevronDown: <path d="M6 9l6 6 6-6"/>,
        sparkles: <><path d="M12 3l1.9 4.9L19 10l-4.1 3.1L16 18l-4-2.8L8 18l1.1-4.9L5 10l5.1-2.1z"/><path d="M19 3l.8 2.2L22 6l-1.8 1.4.5 2.2-1.7-1.3L17.3 9.6l.5-2.2L16 6l2.2-.8z"/></>,
        agent: <><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="11"/><circle cx="8.5" cy="16" r="1" fill={color}/><circle cx="15.5" cy="16" r="1" fill={color}/></>,
        engineering: <><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/></>,
        infra: <><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></>,
        observability: <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></>,
        data: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>,
        gateway: <><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></>,
        shield: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>,
        finance: <><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></>,
        health: <><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></>,
        saas: <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
        retail: <><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></>,
        mfg: <><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></>,
        prof: <><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></>,
        cost: <><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
        check: <polyline points="20 6 9 17 4 12"/>
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0 }}>
          {paths[name] || <circle cx="12" cy="12" r="9"/>}
        </svg>
      );
    };

    const AnnouncementBar = () => (
      <div style={{ background: 'var(--color-iris-pulse)', color: '#ffffff', padding: '10px 24px', fontSize: 13, fontWeight: 500, letterSpacing: '-0.02em', zIndex: 1100 }}>
        <div style={{ maxWidth: 'var(--page-max-width)', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
          <span style={{ margin: '0 auto' }}>Announcing SlashLLM Enterprise Cohort 2026 — Dedicated autonomous agents & GPU clusters with SLA guarantees.</span>
          <a href="https://cal.com/mridhul-pax-jjhwct/30min" target="_blank" rel="noopener noreferrer" className="btn-pill-header hide-mobile">
            Schedule Briefing <Icon name="arrowRight" size={12} />
          </a>
        </div>
      </div>
    );

    /* Header Navigation (White, 64px, Hairline Border) */
    const GlobalNav = ({ activePage = 'industries' }) => {
      const [openDropdown, setOpenDropdown] = React.useState(null);
      const timerRef = React.useRef(null);
      const currentPath = typeof window !== 'undefined' ? window.location.pathname.toLowerCase() : '';

      const isServicesActive = activePage === 'services' || currentPath.includes('/services');
      const isIndustriesActive = activePage === 'industries' || currentPath.includes('/industries');
      const isProductsActive = activePage === 'products' || currentPath.includes('/products');
      const isSolutionsActive = activePage === 'solutions' || currentPath.includes('/solutions');
      const isStoriesActive = activePage === 'stories' || currentPath.includes('/casestudies') || currentPath.includes('/case-studies');
      const isInsightsActive = activePage === 'insights' || currentPath.includes('/blog');
      const isCompanyActive = activePage === 'company' || currentPath.includes('/about');

      const handleMouseEnter = (name) => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
        }
        setOpenDropdown(name);
      };

      const handleMouseLeave = () => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
        }
        timerRef.current = setTimeout(() => {
          setOpenDropdown(null);
        }, 180);
      };

      const getCoverDiameter = (width, height, x, y) => {
        return Math.ceil(
          2 * Math.max(
            Math.hypot(x, y),
            Math.hypot(width - x, y),
            Math.hypot(x, height - y),
            Math.hypot(width - x, height - y)
          )
        );
      };

      const NavSubItem = ({ item }) => {
        const itemRef = React.useRef(null);
        const [hovered, setHovered] = React.useState(false);
        const [origin, setOrigin] = React.useState({ x: 0, y: 0 });
        const [coverSize, setCoverSize] = React.useState(0);

        const updateOriginFromPointer = (e) => {
          const node = itemRef.current;
          if (!node) return;
          const rect = node.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          setOrigin({ x, y });
          setCoverSize(getCoverDiameter(rect.width, rect.height, x, y));
        };

        const handlePointerEnter = (e) => {
          updateOriginFromPointer(e);
          setHovered(true);
        };

        const handlePointerLeave = () => {
          setHovered(false);
        };

        return (
          <a
            ref={itemRef}
            href={item.href}
            onPointerEnter={handlePointerEnter}
            onPointerLeave={handlePointerLeave}
            style={{
              position: 'relative',
              display: 'flex',
              alignItems: 'flex-start',
              gap: 10,
              padding: '9px 11px',
              borderRadius: 'var(--radius-cards)',
              textDecoration: 'none',
              overflow: 'hidden',
              transition: 'box-shadow 0.25s ease'
            }}
            className="nav-sub-item"
          >
            <span
              style={{
                position: 'absolute',
                left: origin.x,
                top: origin.y,
                width: coverSize || 10,
                height: coverSize || 10,
                borderRadius: '50%',
                transform: `translate(-50%, -50%) scale(${hovered && coverSize > 0 ? 1 : 0})`,
                transformOrigin: 'center',
                background: 'linear-gradient(135deg, #00c0f8 0%, #6366f1 35%, #a855f7 70%, #fb68c3 100%)',
                transition: 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease',
                pointerEvents: 'none',
                zIndex: 0,
                opacity: hovered ? 1 : 0
              }}
            />

            <div
              style={{
                position: 'relative',
                zIndex: 1,
                width: 30,
                height: 30,
                borderRadius: 6,
                background: hovered ? 'rgba(255, 255, 255, 0.25)' : (item.bg || '#f0f0f2'),
                border: `1px solid ${hovered ? 'rgba(255, 255, 255, 0.45)' : (item.border || 'transparent')}`,
                color: hovered ? '#ffffff' : (item.color || 'var(--color-obsidian-ink)'),
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                flexShrink: 0,
                boxShadow: hovered ? '0 2px 8px rgba(0,0,0,0.15)' : 'none',
                transform: hovered ? 'scale(1.08)' : 'scale(1)',
                transition: 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)'
              }}
            >
              <Icon name={item.icon} size={15} color={hovered ? '#ffffff' : (item.color || 'var(--color-obsidian-ink)')} />
            </div>

            <div style={{ position: 'relative', zIndex: 1 }}>
              <p
                style={{
                  fontSize: 13,
                  fontWeight: 600,
                  color: hovered ? '#ffffff' : 'var(--color-obsidian-ink)',
                  marginBottom: 2,
                  transition: 'color 0.2s ease',
                  lineHeight: 1.25
                }}
              >
                {item.title}
              </p>
              <p
                style={{
                  fontSize: 11.5,
                  color: hovered ? 'rgba(255, 255, 255, 0.92)' : 'var(--color-fog)',
                  lineHeight: 1.3,
                  transition: 'color 0.2s ease'
                }}
              >
                {item.desc}
              </p>
            </div>
          </a>
        );
      };

      const servicesMenu = [
        { title: 'AI & Generative AI', desc: 'Enterprise LLMs, SLMs, multimodal & RAG architectures', href: '/Services.html#ai-genai', icon: 'sparkles', color: '#00c0f8', bg: 'rgba(0, 192, 248, 0.12)', border: 'rgba(0, 192, 248, 0.25)' },
        { title: 'AI Agents & Workflows', desc: 'Autonomous & human-in-the-loop multi-agent systems', href: '/Services.html#ai-agents', icon: 'agent', color: '#6366f1', bg: 'rgba(99, 102, 241, 0.12)', border: 'rgba(99, 102, 241, 0.25)' },
        { title: 'AI Engineering', desc: 'From prototype to scale: architecture, evals & production code', href: '/Services.html#ai-engineering', icon: 'engineering', color: '#a855f7', bg: 'rgba(168, 85, 247, 0.12)', border: 'rgba(168, 85, 247, 0.25)' },
        { title: 'AI Infrastructure & DevOps', desc: 'GPU orchestration, high-throughput model serving & clusters', href: '/Services.html#ai-infrastructure', icon: 'infra', color: '#fb68c3', bg: 'rgba(251, 104, 195, 0.12)', border: 'rgba(251, 104, 195, 0.25)' },
        { title: 'AI Observability & Ops', desc: 'Tracing, latency, token costs, drift & guardrail telemetry', href: '/Services.html#ai-observability', icon: 'observability', color: '#10b981', bg: 'rgba(16, 185, 129, 0.12)', border: 'rgba(16, 185, 129, 0.25)' },
        { title: 'Data & Analytics for AI', desc: 'Vector pipelines, ETL, real-time embeddings & feature stores', href: '/Services.html#data-analytics', icon: 'data', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.12)', border: 'rgba(245, 158, 11, 0.25)' }
