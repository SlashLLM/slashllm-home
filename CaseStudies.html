<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    tailwind = { config: { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['"Space Grotesk"','sans-serif'], mono: ['"JetBrains Mono"','monospace'] } } } } };

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #FAFAFA; color: #1E1B4B; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    :root {
      --bg: #FAFAFA; --surface: #F3F0FF; --card: #EDE9FF;
      --border: #DDD8F0; --text: #1E1B4B; --muted: rgba(30,27,75,0.6);
      --accent: #a855f7; --accent2: #7c3aed;
    }

    .gradient-text {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #be38de 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .nav-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(30,27,75,0.12);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(30,27,75,0.12);
      padding: 12px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
    }
    .nav-item-wrap:hover .nav-dropdown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (max-width: 1024px) {
      .hide-mobile { display: none !important; }
      .grid-2col { grid-template-columns: 1fr !important; }
    }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, size=20, color='currentColor' }) => {
      const paths = {
        arrowRight: <path d="M5 12h14M12 5l7 7-7 7"/>,
        chevronDown: <path d="M6 9l6 6 6-6"/>,
        sparkles: <><path d="M12 3l1.9 4.9L19 10l-4.1 3.1L16 18l-4-2.8L8 18l1.1-4.9L5 10l5.1-2.1z"/><path d="M19 3l.8 2.2L22 6l-1.8 1.4.5 2.2-1.7-1.3L17.3 9.6l.5-2.2L16 6l2.2-.8z"/></>,
        agent: <><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="11"/><circle cx="8.5" cy="16" r="1" fill={color}/><circle cx="15.5" cy="16" r="1" fill={color}/></>,
        engineering: <><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/></>,
        infra: <><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></>,
        observability: <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></>,
        data: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>,
        gateway: <><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></>,
        shield: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>,
        finance: <><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></>,
        health: <><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></>,
        cost: <><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
        check: <polyline points="20 6 9 17 4 12"/>
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          {paths[name] || <circle cx="12" cy="12" r="9"/>}
        </svg>
      );
    };

    const GlobalNav = () => {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', fn);
        return () => window.removeEventListener('scroll', fn);
      }, []);

      const navBtnStyle = {
        color: 'rgba(30,27,75,0.68)', fontSize: 13.5, fontWeight: 500, padding: '8px 12px', borderRadius: 8,
        display: 'inline-flex', alignItems: 'center', gap: 4, background: 'transparent', border: 'none', cursor: 'pointer'
      };

      return (
        <div style={{ position: 'fixed', top: 12, left: 0, right: 0, zIndex: 1000, display: 'flex', justifyContent: 'center', padding: '0 16px' }}>
          <nav style={{
            width: '100%', maxWidth: 1240, height: 56, background: scrolled ? 'rgba(255,255,255,0.96)' : 'rgba(255,255,255,0.85)',
            backdropFilter: 'blur(20px)', border: '1px solid rgba(30,27,75,0.1)', borderRadius: 100, display: 'flex',
            alignItems: 'center', justifyContent: 'space-between', padding: '0 18px'
          }}>
            <a href="/" style={{ display: 'flex', alignItems: 'center', gap: 8, textDecoration: 'none' }}>
              <img src="/uploads/LOGO 2.png" alt="SlashLLM" style={{ width: 28, height: 28 }} />
              <span style={{ fontFamily: '"Space Grotesk",sans-serif', fontWeight: 800, fontSize: 16, color: '#1E1B4B' }}>SlashLLM</span>
            </a>

            <div className="hide-mobile" style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <a href="/Services.html" style={navBtnStyle}>What We Do</a>
              <a href="/Industries.html" style={navBtnStyle}>Industries</a>
              <a href="/Products.html" style={navBtnStyle}>Products & Platforms</a>
              <a href="/Solutions.html" style={navBtnStyle}>Solutions</a>
              <a href="/CaseStudies.html" style={{ ...navBtnStyle, color: '#7c3aed', fontWeight: 600 }}>Customer Stories</a>
              <a href="/blog" style={navBtnStyle}>Insights</a>
              <a href="/About.html" style={navBtnStyle}>Company</a>
            </div>

            <a href="https://cal.com/mridhul-pax-jjhwct/30min" target="_blank" rel="noopener noreferrer"
               style={{ background: '#1E1B4B', color: '#fff', padding: '8px 18px', borderRadius: 100, fontSize: 13, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              Talk to an AI Expert <Icon name="arrowRight" size={13} />
            </a>
          </nav>
        </div>
      );
    };

    const GlobalFooter = () => (
      <footer style={{ borderTop: '1px solid #DDD8F0', background: '#F4F1FA', paddingTop: 64, paddingBottom: 44 }}>
        <div style={{ maxWidth: 1280, margin: '0 auto', padding: '0 28px', textAlign: 'center' }}>
          <span style={{ fontFamily: '"Space Grotesk",sans-serif', fontWeight: 800, fontSize: 20, color: '#1E1B4B' }}>SlashLLM Customer Stories</span>
          <p style={{ fontSize: 13, color: 'rgba(30,27,75,0.6)', marginTop: 6, marginBottom: 24 }}>Real production metrics and technical case studies across Fortune 500 enterprises and fast-growing innovators.</p>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 20, marginBottom: 28 }}>
            <a href="/Services.html" style={{ fontSize: 13, color: '#7c3aed', fontWeight: 600 }}>Services</a>
            <a href="/Industries.html" style={{ fontSize: 13, color: '#7c3aed', fontWeight: 600 }}>Industries</a>
            <a href="/Products.html" style={{ fontSize: 13, color: '#7c3aed', fontWeight: 600 }}>Products</a>
            <a href="/Solutions.html" style={{ fontSize: 13, color: '#7c3aed', fontWeight: 600 }}>Solutions</a>
          </div>
          <p style={{ color: 'rgba(30,27,75,0.45)', fontSize: 12.5 }}>© 2026 SlashLLM Inc. All rights reserved.</p>
        </div>
      </footer>
    );

    function CaseStudiesPage() {
      const caseStudies = [
        {
          id: 'impress-ai',
          client: 'Impress AI',
          industry: 'HR Tech & Enterprise Talent Assessment',
          title: 'Scaling 7-Dimension Video Interview Competency Scoring with Zero Human Bias',
          challenge: 'Recruiting teams needed to evaluate tens of thousands of candidate video interviews across 7 competency dimensions. Existing human review processes had weeks of backlog, severe evaluator variance, and lacked automated methods to detect if candidates were reading off-screen scripts.',
          approach: 'SlashLLM engineered an asynchronous, fault-tolerant video processing architecture. Video streams are automatically transcribed via AWS Transcribe, analyzed frame-by-frame for pupil gaze vectors using MediaPipe computer vision, and evaluated for linguistic reasoning using AWS Bedrock Claude Opus models.',
          techStack: ['AWS Bedrock (Claude Opus)', 'MediaPipe Iris Tracking', 'AWS Transcribe', 'S3 Event Pipelines', 'FastAPI & PyTorch'],
          implementation: 'Shipped to production in 6 weeks with zero downtime. Handled 100+ concurrent video uploads during global campus recruiting spikes.',
          outcome: 'Over 2,800 frames analyzed per interview in real time, 100% elimination of evaluation backlog, and validated candidate integrity across 500,000+ applicants.',
          metric: '7-Dim',
          metricDesc: 'Standardized Competency Scoring'
        },
        {
          id: 'fintech-routing',
          client: 'Global FinTech Scaleup',
          industry: 'Financial Services & Wealth Management',
          title: 'Slashing LLM API Spend by 38% while Improving P95 Latency by 4.2x',
          challenge: 'A high-growth fintech was spending $120k+/month on frontier commercial LLMs for customer banking support and compliance classification. Volatile latency spikes (3,500ms+) were causing degraded UX and frequent socket timeouts.',
          approach: 'SlashLLM deployed the SlashLLM Gateway with semantic embedding caching and automated prompt complexity classification. Routine queries (80% of volume) are routed to fine-tuned local SLMs or cached responses, reserving expensive frontier models only for complex financial logic.',
          techStack: ['SlashLLM Gateway', 'Qdrant Vector DB', 'vLLM Inference Cluster', 'Fine-Tuned Llama 3.3', 'Prometheus & OpenTelemetry'],
          implementation: 'Zero-downtime proxy swap implemented over a weekend with complete backward compatibility for existing OpenAI SDK endpoints.',
          outcome: '38% immediate reduction in monthly inference expenditure ($45,000+ monthly savings) and P95 latency reduced from 3,400ms down to 810ms.',
          metric: '38%',
          metricDesc: 'Inference Cost Reduction'
        },
        {
          id: 'careo-health',
          client: 'CareO Health Operations',
          industry: 'Healthcare & Clinical Care Home Management',
          title: 'HIPAA-Compliant Patient Intake & Clinical Audit Trail Automation',
          challenge: 'Clinical care home networks struggled with manual nursing shift notes and complex regulatory audit documentation, consuming 3+ hours per nurse per shift.',
          approach: 'SlashLLM built an air-gapped clinical voice assistant that listens to verbal shift handoffs, automatically structures symptoms and medication logs into EHR schemas, and signs off with cryptographic audit timestamps.',
          techStack: ['HIPAA-Ready Private VPC', 'Local Speech-to-Text Whisper', 'Deterministic Guardrail Harness', 'PostgreSQL pgvector'],
          implementation: 'Full HIPAA third-party compliance certification achieved prior to clinical deployment across 42 residential facilities.',
          outcome: 'Nursing administrative documentation time reduced by 72%, capturing 100% compliance audit logs without any external cloud data leakage.',
          metric: '72%',
          metricDesc: 'Admin Documentation Time Saved'
        }
      ];

      return (
        <React.Fragment>
          <GlobalNav />
          <main style={{ paddingTop: 100 }}>

            <section style={{ padding: '80px 28px 60px', textAlign: 'center', background: 'linear-gradient(180deg, #F3F0FF 0%, #FAFAFA 100%)' }}>
              <div style={{ maxWidth: 840, margin: '0 auto' }}>
                <span style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11.5, color: '#7c3aed', letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 600 }}>

                <h1 style={{ fontFamily: '"Space Grotesk",sans-serif', fontSize: 'clamp(38px, 4vw, 62px)', fontWeight: 800, letterSpacing: '-0.04em', color: '#1E1B4B', margin: '16px 0 20px' }}>

                    {/* Header Row */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 20, borderBottom: '1px solid rgba(30,27,75,0.08)', paddingBottom: 24, marginBottom: 32 }}>
                      <div>
                        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(124,58,237,0.08)', borderRadius: 100, padding: '4px 14px', marginBottom: 12 }}>
                          <span style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11, color: '#7c3aed', fontWeight: 600 }}>{cs.client} · {cs.industry}</span>
                        </div>
                        <h2 style={{ fontFamily: '"Space Grotesk",sans-serif', fontSize: 26, fontWeight: 800, color: '#1E1B4B', letterSpacing: '-0.03em', maxWidth: 840 }}>
                          {cs.title}
                        </h2>
                      </div>
                      <div style={{ background: 'linear-gradient(135deg, #1E1B4B, #2d2766)', color: '#fff', borderRadius: 14, padding: '16px 24px', textAlign: 'center', minWidth: 160 }}>
                        <p style={{ fontFamily: '"Space Grotesk",sans-serif', fontSize: 32, fontWeight: 800, color: '#4ade80', lineHeight: 1 }}>{cs.metric}</p>
                        <p style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 9.5, color: 'rgba(255,255,255,0.7)', textTransform: 'uppercase', letterSpacing: '0.08em', marginTop: 4 }}>{cs.metricDesc}</p>
                      </div>
                    </div>

                    {/* Consulting Steps Grid */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32, marginBottom: 32 }} className="grid-2col">
                      <div style={{ background: '#FAF9FD', border: '1px solid #EAE6F3', borderRadius: 14, padding: '24px 26px' }}>
                        <p style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11, color: '#ef4444', textTransform: 'uppercase', letterSpacing: '0.1em', fontWeight: 700, marginBottom: 8 }}>01. The Challenge</p>
                        <p style={{ fontSize: 14, color: 'rgba(30,27,75,0.75)', lineHeight: 1.65 }}>{cs.challenge}</p>
                      </div>

                      <div style={{ background: '#FAF9FD', border: '1px solid #EAE6F3', borderRadius: 14, padding: '24px 26px' }}>
                        <p style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11, color: '#7c3aed', textTransform: 'uppercase', letterSpacing: '0.1em', fontWeight: 700, marginBottom: 8 }}>02. Engineering Approach</p>
                        <p style={{ fontSize: 14, color: 'rgba(30,27,75,0.75)', lineHeight: 1.65 }}>{cs.approach}</p>
                      </div>
                    </div>

                    {/* Tech Stack Bar & Business Outcome */}
                    <div style={{ background: '#F8F6FC', border: '1px solid #E5DFFA', borderRadius: 16, padding: '24px 28px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 16, marginBottom: 18, borderBottom: '1px solid rgba(30,27,75,0.06)', paddingBottom: 14 }}>
                        <span style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11, color: 'rgba(30,27,75,0.5)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Technology Stack</span>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                          {cs.techStack.map((tech, tIdx) => (
                            <span key={tIdx} style={{ background: '#fff', border: '1px solid #DDD8F0', borderRadius: 100, padding: '4px 12px', fontSize: 11.5, fontWeight: 500, color: '#1E1B4B' }}>{tech}</span>
                          ))}
                        </div>
                      </div>

                      <div>
                        <p style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 11, color: '#22c55e', textTransform: 'uppercase', letterSpacing: '0.1em', fontWeight: 700, marginBottom: 4 }}>03. Proven Business Outcome</p>
                        <p style={{ fontSize: 14.5, fontWeight: 600, color: '#1E1B4B', lineHeight: 1.6 }}>{cs.outcome}</p>
                      </div>
                    </div>

                  </div>
                ))}
              </div>
            </section>
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CaseStudiesPage />);
  </script>
</body>
</html>
