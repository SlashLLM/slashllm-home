    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #FAFAFA; color: #1E1B4B; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    :root {
      --bg: #FAFAFA; --surface: #F3F0FF; --card: #EDE9FF;
      --border: #DDD8F0; --text: #1E1B4B; --muted: rgba(30,27,75,0.6);
      --accent: #a855f7; --accent2: #7c3aed;
    }

    .gradient-text {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #be38de 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.65s cubic-bezier(0.16,1,0.3,1); }
    .reveal.in { opacity: 1; transform: translateY(0); }

    .nav-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(30,27,75,0.12);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(30,27,75,0.12);
      padding: 12px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
    }
    .nav-item-wrap:hover .nav-dropdown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (max-width: 1000px) {
      .grid-2col { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 36px !important; }
    }
    @media (max-width: 640px) {
      .footer-grid { grid-template-columns: 1fr !important; }
    }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, size=20, color='currentColor' }) => {

      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">

      const [scrolled, setScrolled] = useState(false);

              <a href="/Solutions.html" style={navBtnStyle}>Solutions</a>
              <a href="/CaseStudies.html" style={navBtnStyle}>Customer Stories</a>
              <a href="/blog" style={navBtnStyle}>Insights</a>

                    </div>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                    {values.map((v, i) => (
                      <div key={i} style={{ borderBottom: i < values.length - 1 ? '1px solid rgba(30,27,75,0.06)' : 'none', paddingBottom: i < values.length - 1 ? 16 : 0 }}>
                        <p style={{ fontFamily: '"Space Grotesk",sans-serif', fontSize: 15, fontWeight: 700, color: '#1E1B4B', marginBottom: 4 }}>
                          <span style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 12, color: '#7c3aed', marginRight: 8 }}>{v.num}.</span>
                          {v.title}
                        </p>
                        <p style={{ fontSize: 13.5, color: 'rgba(30,27,75,0.65)', lineHeight: 1.6 }}>{v.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AboutPage />);
