<script type="text/babel">
  function App() {
    const [activeId, setActiveId] = React.useState('roadmap');

    React.useEffect(() => {
      // Scroll spy
      const sections = document.querySelectorAll('[data-service-id]');
      const spyObs = new IntersectionObserver(
        entries => entries.forEach(e => { if (e.isIntersecting) setActiveId(e.target.getAttribute('data-service-id')); }),
        { rootMargin:'-22% 0px -68% 0px', threshold:0 }
      );
      sections.forEach(s => spyObs.observe(s));

      // Reveal on scroll
      const revealEls = document.querySelectorAll('.reveal');
      const revealObs = new IntersectionObserver(
        entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealObs.unobserve(e.target); } }),
        { threshold:0.04 }
      );
      revealEls.forEach(el => revealObs.observe(el));

      return () => { spyObs.disconnect(); revealObs.disconnect(); };
    }, []);

    return (
      <React.Fragment>
        <Nav />
        <main>
          <ServicesHero />
          <StickyNav activeId={activeId} />
          {SERVICES.map(s => (
            <React.Fragment key={s.id}>
              <ChapterLine num={s.num} bg={s.bg} />
              <ServiceSection s={s} />
            </React.Fragment>
          ))}
          <NotSureCTA />
        </main>
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
