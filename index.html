  <script type="text/babel">
    const NeuralCanvas = () => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let W, H, frame;
        const resize = () => {
          W = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
          H = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
          canvas.style.width = canvas.offsetWidth + 'px';
          canvas.style.height = canvas.offsetHeight + 'px';
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        };
        resize();
        window.addEventListener('resize', resize);

        const N = 56;
        const nodes = Array.from({length: N}, () => ({
          x: Math.random() * (W / window.devicePixelRatio),
          y: Math.random() * (H / window.devicePixelRatio),
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 2 + 1,
          pulse: Math.random() * Math.PI * 2,
          hue: Math.random() > 0.6 ? 280 : Math.random() > 0.5 ? 300 : 260,
        }));

        const draw = () => {
          const pw = W / window.devicePixelRatio;
          const ph = H / window.devicePixelRatio;
          ctx.clearRect(0, 0, pw, ph);

          const cx = pw * 0.54, cy = ph * 0.46;
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, pw * 0.52);
          g.addColorStop(0,   'rgba(168,85,247,0.22)');
          g.addColorStop(0.35,'rgba(190,56,222,0.11)');
          g.addColorStop(0.7, 'rgba(82,151,240,0.05)');
          g.addColorStop(1,   'transparent');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, pw, ph);

          nodes.forEach(n => {
            n.x += n.vx; n.y += n.vy;
            if (n.x < 0 || n.x > pw) n.vx *= -1;
            if (n.y < 0 || n.y > ph) n.vy *= -1;
            n.pulse += 0.018;
          });

          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const dx = nodes[i].x - nodes[j].x;
              const dy = nodes[i].y - nodes[j].y;
              const d = Math.sqrt(dx*dx + dy*dy);
              if (d < 140) {
                const a = (1 - d/140) * 0.24;
                const midHue = (nodes[i].hue + nodes[j].hue) / 2;
                ctx.strokeStyle = `hsla(${midHue},80%,65%,${a})`;
                ctx.lineWidth = 0.65;
                ctx.beginPath();
                ctx.moveTo(nodes[i].x, nodes[i].y);
                ctx.lineTo(nodes[j].x, nodes[j].y);
                ctx.stroke();
              }
            }
          }

          nodes.forEach(n => {
            const p = 0.55 + Math.sin(n.pulse) * 0.45;
            const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 5);
            ng.addColorStop(0, `hsla(${n.hue},80%,68%,${0.45 * p})`);
            ng.addColorStop(1, 'transparent');
            ctx.fillStyle = ng;
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = `hsla(${n.hue},90%,80%,${0.75 * p})`;
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
          });

          frame = requestAnimationFrame(draw);
        };
        draw();
        return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', resize); };
      }, []);
      return <canvas ref={canvasRef} style={{ width:'100%', height:'100%', display:'block' }} />;
    };

  <script type="text/babel">
    function App() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
        }, { threshold: 0.06 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);

      return (
        <React.Fragment>
          <GlobalNav />
          <main>
            <Hero />
            <LogoBar />
            <CapabilitiesSection />
            <IndustryMatrixSection />
            <SolutionsSection />
            <ProductsSuiteSection />
            <CaseStudiesSection />
            <InsightsSection />
            <BottomCTA />
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
