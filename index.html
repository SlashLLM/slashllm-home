  <style>
    /* ════ Privy Design System Tokens ════ */
    :root {
      /* Colors */
      --color-canvas: #ffffff;
      --color-obsidian-ink: #010110;
      --color-carbon: #111117;
      --color-graphite: #22222a;
      --color-fog: #73737c;
      --color-ash: #d9d9d9;
      --color-iris-pulse: #635bff;
      --color-deep-teal: #072723;
      --border-hairline: rgba(1, 1, 16, 0.1);
      --border-dark-hairline: rgba(255, 255, 255, 0.08);

      /* Typography Families (100% Proxima Nova Unified) */
      --font-display: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-sans: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      /* Spacing & Layout */
      --page-max-width: 1200px;
      --section-gap: 80px;
      --card-padding: 24px;

      /* Radii */
      --radius-cards: 8px;
      --radius-buttons: 100px;
      --radius-tags: 9999px;
      --radius-nav: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-canvas);
      color: var(--color-obsidian-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
      letter-spacing: -0.015em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, select, textarea {
      font-family: inherit;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }

    /* Typography Utilities */
    .font-display {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .font-sans {
      font-family: var(--font-sans);
      letter-spacing: -0.015em;
    }
    .font-mono {
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    /* Gradient Text Accents */
    .gradient-text-purple {
      background: linear-gradient(135deg, #010110 10%, #635bff 60%, #9333ea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline;
    }
    .gradient-text-light {
      background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 75%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline;
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #0c0a21 0%, #1e134b 55%, #351c75 100%);
      color: #ffffff !important;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      padding: 12px 24px;
      border-radius: var(--radius-buttons);
      border: 1px solid rgba(99, 91, 255, 0.25);
      box-shadow: 0 4px 14px rgba(30, 19, 75, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #635bff 0%, #7c3aed 100%);
      border-color: rgba(99, 91, 255, 0.5);
      box-shadow: 0 6px 20px rgba(99, 91, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-obsidian-ink) !important;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      padding: 12px 24px;
      border-radius: var(--radius-buttons);
      border: 1px solid rgba(1, 1, 16, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-ghost:hover {
      background: #f5f3ff;
      border-color: var(--color-iris-pulse);
      color: var(--color-iris-pulse) !important;
    }

    .btn-pill-header {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff !important;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: var(--radius-buttons);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-pill-header:hover {
      background: #ffffff;
      color: var(--color-iris-pulse) !important;
    }

    /* Cards & Hover Effects */
    .card-editorial {
      background: var(--color-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-cards);
      padding: 28px;
      transition: all 0.2s ease;
    }
    .card-editorial:hover {
      border-color: rgba(99, 91, 255, 0.35);
      box-shadow: 0 12px 32px rgba(99, 91, 255, 0.05);
    }

    .card-dark {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-cards);
      padding: 28px;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .card-dark:hover {
      border-color: rgba(99, 91, 255, 0.5);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
    }

    /* Links */
    .link-editorial {
      color: var(--color-obsidian-ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .link-editorial:hover {
      color: var(--color-iris-pulse);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-muted {
      color: var(--color-fog);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .link-muted:hover {
      color: var(--color-obsidian-ink);
    }

    /* Dropdown Menu */
    .nav-item-wrap {
      position: relative;
    }
    .nav-dropdown {
      position: absolute;
      top: 100%;
      margin-top: 6px;
      background: #ffffff;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-cards);
      box-shadow: 0 16px 36px rgba(1, 1, 16, 0.08);
      padding: 12px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    /* Invisible hover bridge spanning between nav item and dropdown */
    .nav-dropdown::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 0;
      right: 0;
      height: 16px;
      display: block;
    }
    .nav-item-wrap:hover .nav-dropdown,
    .nav-dropdown:hover {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Dotted Halftone Pattern for Footer */
    .halftone-pattern {
      background-image: radial-gradient(var(--color-ash) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* Animations & Utilities */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .logo-marquee { display: flex; animation: marquee 30s linear infinite; }
    .logo-marquee:hover { animation-play-state: paused; }

    @media (max-width: 1024px) {
      .hide-mobile { display: none !important; }
      .hero-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .grid-3col { grid-template-columns: 1fr 1fr !important; }
      .grid-4col { grid-template-columns: 1fr 1fr !important; }
      .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 36px !important; }
    }
    @media (max-width: 640px) {
      .grid-3col { grid-template-columns: 1fr !important; }
      .grid-4col { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>

  <script type="text/babel">
    function App() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
        }, { threshold: 0.05 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);

      return (
        <React.Fragment>
          <AnnouncementBar />
          <GlobalNav />

            <BottomCTA />
          </main>
          <GlobalFooter />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
